name: her-garden-test
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: garden_test
      POSTGRES_DB: garden_test
      POSTGRES_PASSWORD: test-only-password
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garden_test -d garden_test"]
      interval: 2s
      timeout: 3s
      retries: 20
