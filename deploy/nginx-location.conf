# Include inside the EXISTING HTTPS server block. No domain-specific data lives here.
location /garden/ {
    proxy_pass http://127.0.0.1:8002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 120s;
    client_max_body_size 64k;
    # OAuth query strings contain codes/state; do not log them.
    access_log off;
}
location = /.well-known/oauth-authorization-server/garden {
    proxy_pass http://127.0.0.1:8002;
    proxy_set_header Host $host;
    access_log off;
}
location = /.well-known/oauth-protected-resource/garden/mcp {
    proxy_pass http://127.0.0.1:8002;
    proxy_set_header Host $host;
    access_log off;
}
