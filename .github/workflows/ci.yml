name: CI
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: garden_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: garden_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U garden_test -d garden_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://garden_test:test-only-password@localhost:5432/garden_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.7"
      - run: uv sync --frozen --group dev
      - run: make check
      - run: uv run ruff format --check src tests scripts
      - run: docker build -t her-garden:ci .
